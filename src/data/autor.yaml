residencia: Monroyo, Teruel, Aragón, España
generos: Fantasía, Terror, Ficción especulativa
bio_corta: >
  Escritor montrogino. Autor de la saga de fantasía y terror «Killasagh» y del
  relato «El Grito que Ahogaron tus Manos». Publica artículos de opinión y
  cultura en La Comarca Grupo de Comunicación.
bio_completa: Luis Miguel Agud Sorlí nació y creció en Monroyo, donde la
  imaginación encontró pronto el camino hacia las páginas.
