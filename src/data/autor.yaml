subtitulo: Escritor
residencia: Monroyo, Aragón.
bio_corta: >
  Escritor. Autor de la saga de fantasía y terror «Killasagh» y del relato «El
  Grito que Ahogaron tus Manos». Publica artículos de opinión y cultura en La
  Comarca Grupo de Comunicación.
bio_completa: >-
  ¡Hola! Soy Luismi.


  Soy historiador, escritor y colaborador periodístico. A lo largo de los años
  he ido combinando estas tres facetas, que en el fondo tienen mucho más en
  común de lo que parece: todas parten de la curiosidad y de las ganas de
  entender y contar historias.


  Como historiador, me dedico a analizar la libertad religiosa a lo largo de la
  Edad Contemporánea, centrándome especialmente en el caso español. Como
  escritor, disfruto construyendo nuevos libros y explorando mundos imaginarios
  a través de la ficción. Y como articulista, reflexiono sobre la actualidad, la
  política, la cultura y todo aquello que me llama la atención.


  En esta web encontrarás una muestra de mi trabajo, mis proyectos y algunas de
  las ideas que voy dejando por el camino.


  ¡Gracias por pasarte por aquí!
